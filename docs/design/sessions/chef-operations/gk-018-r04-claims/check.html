<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>running</title></head><body>
<!-- Design-review tooling only (GK-018 r04-claims): drives the prototype in a same-origin iframe and writes PASS/FAIL lines.
     Run: Chrome --headless=new --virtual-time-budget=60000 --dump-dom http://127.0.0.1:4196/gk-018-r04-claims/check.html -->
<iframe id="f" title="Prototype under test" style="width:1440px;height:900px;border:0"></iframe><pre id="out"></pre>
<script src="poc/states.js"></script>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');let fails=0;
const log=(ok,msg)=>{if(!ok)fails++;out.textContent+=(ok?'PASS ':'FAIL ')+msg+'\n'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const open=src=>new Promise(r=>{f.onload=()=>setTimeout(()=>r(f.contentDocument),300);f.src='poc/'+src+(/role=/.test(src)?'':(src.includes('?')?'&':'?')+'role=chef')});
const $=(d,s)=>d.querySelector(s),txt=(d,s)=>($(d,s)||{}).textContent||'';
const click=el=>el&&el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
const set=(el,v,ev='input')=>{el.value=v;el.dispatchEvent(new Event(ev,{bubbles:true}))};
(async()=>{
 let d=await open('request.html?id=c7e1a904&role=chef');
 log(d.querySelectorAll('h1').length===1,'one h1 on the email-link request');
 click($(d,'[data-go=approve]'));log(/Add order 3f9c71a2 to Amelia Rose’s account\?/.test(txt(d,'#ca-h')),'confirm names the order and account');
 log(d.activeElement&&d.activeElement.id==='ca-h','focus moves to the confirm heading');
 click($(d,'[data-go="approve-yes"]'));log(/Adding…/.test(txt(d,'.decision')),'busy label Adding…');
 await wait(1300);log(/Added to Amelia Rose’s account/.test(txt(d,'.result')),'added result');
 log(d.activeElement&&d.activeElement.classList.contains('result'),'focus on the result');
 log(/Added to their account/.test(txt(d,'.page-head')),'header shows Added after saving');
 log(/Prototype: nothing is saved/.test(txt(d,'.result')),'simulated action labelled');
 d=await open('request.html?id=c7e1a904');click($(d,'[data-go=decline]'));const n=$(d,'[name=note]');set(n,'No match in my records');
 log(/478 characters left/.test(txt(d,'#note-count')),'note counter updates');
 $(d,'[data-decline]').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait(1300);
 log(/Declined ✓/.test(txt(d,'.result'))&&/No match in my records/.test(txt(d,'.result')),'declined with the internal note');
 d=await open('request.html?id=9a3f2c71');const add=[...d.querySelectorAll('.decision button')].find(b=>/Add to their account/.test(b.textContent));
 log(add&&add.disabled,'older order: Add disabled until an order is chosen');
 set($(d,'[data-find] [name=q]'),'8b2');log(d.querySelectorAll('.pick').length===2,'search “8b2” finds two orders');
 const r=[...d.querySelectorAll('[name=pick]')].find(x=>x.value==='8b20d4e6');r.checked=true;r.dispatchEvent(new Event('change',{bubbles:true}));
 log(/Add order 8b20d4e6 to their account/.test(txt(d,'.decision')),'choosing an order enables Add with its ID');
 set($(d,'[data-find] [name=from]'),'2026-01','change');log(/up to 3 months/i.test(txt(d,'#find-out')),'more than 3 months is refused');
 d=await open('request.html?id=1d5e88b0');log(/No orders found/.test(txt(d,'#find-count'))&&/No matching order in the system yet/.test(txt(d,'.no-match')),'Instagram: no matching order guidance');
 d=await open('request.html?id=f20b6d18&answer=order_owned');click($(d,'[data-go=approve]'));click($(d,'[data-go="approve-yes"]'));await wait(1300);
 log(/already in another customer’s account/.test(txt(d,'.result')),'ORDER_OWNED refusal');
 d=await open('request.html?id=c7e1a904&answer=lost');click($(d,'[data-go=approve]'));click($(d,'[data-go="approve-yes"]'));await wait(1300);
 log(/couldn’t tell whether it was saved/.test(txt(d,'.result')),'answer lost');click([...d.querySelectorAll('.result button')].find(b=>/Try again/.test(b.textContent)));await wait(1300);
 log(/Added to Amelia Rose’s account/.test(txt(d,'.result')),'retry after a lost answer succeeds (same decision)');
 d=await open('request.html?id=c7e1a904&answer=stale&step=done&decision=approve');click([...d.querySelectorAll('.result a')].find(a=>/Show the latest/.test(a.textContent)));await wait(700);d=f.contentDocument;
 log(/Withdrawn by the customer/.test(txt(d,'.page-head')),'Show the latest: withdrawn meanwhile');
 d=await open('requests.html?state=more');click($(d,'[data-more]'));log(d.querySelectorAll('#rows tr').length===8,'Show the next requests adds the next page');
 d=await open('requests.html?role=support');log(!d.querySelector('a[href="requests.html"] .nav-count')&&/Elina’s \(chef\) only/.test(txt(d,'.role-note')),'technical support: no item, role note');
 d=await open('order.html?id=e5d2b817&opt=b&role=chef');$(d,'[data-assign]').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 log($(d,'[name=acct]').getAttribute('aria-invalid')==='true','option B: empty account ID refused');
 set($(d,'[name=acct]'),'0f6d1a2b-3c4d-4e5f-8a9b-0c1d2e3f4a5b');set($(d,'[name=evidence]'),'Asked by DM');$(d,'[data-assign]').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 log(/Add order e5d2b817 to account 0f6d1a2b…\?/.test(txt(d,'#cb-h')),'option B: confirm');
 for(const p of ['requests.html','request.html?id=1d5e88b0','order.html?id=e5d2b817']){d=await open(p);const small=[...d.querySelectorAll('#main button,#main a.btn,#main input,#main select')].filter(e=>e.offsetParent&&e.getBoundingClientRect().height<44&&e.type!=='radio');log(!small.length,`${p}: controls at least 44 px tall${small.length?' ('+small.map(e=>e.textContent.trim()||e.name).join(', ')+')':''}`)}
 f.style.width='390px';for(const p of STATES.map(x=>x[1])){d=await open(p);const w=d.documentElement.scrollWidth;const main=d.querySelector('#main')||d.body;const over=[...main.querySelectorAll('*')].filter(e=>e.getBoundingClientRect().right>391&&!e.closest('.sidebar,.table-wrap'));log(w<=390&&!over.length,`390 px, no overflow: ${p}${over.length?' ('+over.slice(0,3).map(e=>e.className||e.tagName).join(', ')+')':''}`)}
 document.title=fails?`FAIL ${fails}`:'PASS';
})();
</script></body></html>
