<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>running</title></head><body>
<!-- Design-review tooling only (GK-018 r04b-claims): drives the prototype in a same-origin iframe and writes PASS/FAIL lines.
     Run: Chrome --headless=new --virtual-time-budget=60000 --dump-dom http://127.0.0.1:4196/gk-018-r04-claims/check.html -->
<iframe id="f" title="Prototype under test" style="width:1440px;height:900px;border:0"></iframe><pre id="out"></pre>
<script src="poc/states.js"></script>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');let fails=0;
const log=(ok,msg)=>{if(!ok)fails++;out.textContent+=(ok?'PASS ':'FAIL ')+msg+'\n'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const open=src=>new Promise(r=>{f.onload=()=>setTimeout(()=>r(f.contentDocument),300);let u=withData(src);if(!/role=/.test(u))u+='&role=chef';f.src='poc/'+u});
const $=(d,s)=>d.querySelector(s),txt=(d,s)=>($(d,s)||{}).textContent||'';
const click=el=>el&&el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
const set=(el,v,ev='input')=>{el.value=v;el.dispatchEvent(new Event(ev,{bubbles:true}))};
const submit=el=>el.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
const btn=(d,re,sel='button')=>[...d.querySelectorAll(sel)].find(b=>re.test(b.textContent));
(async()=>{
 let d=await open('requests.html');
 log(d.querySelectorAll('#rows tr').length===5&&!d.querySelector('.tag-future')&&!/order page or email/.test(txt(d,'#rows')),'today data: 5 waiting older-order requests, no email-link rows');
 log(/Looks like a website order reference/.test(txt(d,'#rows')),'queue flags references that look like website orders');
 d=await open('requests.html?data=future');log(d.querySelectorAll('#rows .tag-future').length===3&&/Arrives once/.test(txt(d,'.future-note')),'future data: 3 email-link rows tagged Future, with the note');
 d=await open('request.html?id=c7e1a904&data=future');log(/Future state/.test(txt(d,'.future-banner')),'email-link request page carries the future banner');
 d=await open('request.html?id=9a3f2c71'+P);
 log(d.querySelectorAll('h1').length===1,'one h1 on the older-order request');
 click(btn(d,/Add order 8b20d4e6/));log(/Add order 8b20d4e6 to Tom Becker’s account\?/.test(txt(d,'#ca-h')),'confirm names the order and account');
 log(d.activeElement&&d.activeElement.id==='ca-h','focus moves to the confirm heading');
 log(/browser that placed it/.test(txt(d,'[data-approve]'))&&!/emails stop working/.test(txt(d,'[data-approve]')),'approve wording is true today (guest access in the placing browser)');
 set($(d,'[data-approve] [name=note]'),'x'.repeat(501));log(/1 characters too many/.test(txt(d,'#note-count')),'note counter counts over the limit');
 submit($(d,'[data-approve]'));log(/up to 500 characters/.test(txt(d,'#note-err'))&&$(d,'[name=note]').getAttribute('aria-invalid')==='true','a note over 500 characters is refused');
 set($(d,'[data-approve] [name=note]'),'Name and date match');submit($(d,'[data-approve]'));log(/Adding…/.test(txt(d,'.decision')),'busy label Adding…');
 await wait(1300);log(/Added to Tom Becker’s account/.test(txt(d,'.result'))&&/Name and date match/.test(txt(d,'.result')),'added, with the internal note echoed');
 log(d.activeElement&&d.activeElement.classList.contains('result'),'focus on the result');
 log(/Added to their account/.test(txt(d,'.page-head')),'header shows Added after saving');
 log(/Prototype: nothing is saved/.test(txt(d,'.result')),'simulated action labelled');
 log(/staff account/.test(txt(d,'.decision')),'footer says staff account, not name');
 d=await open('request.html?id=1d5e88b0');log(/No orders found/.test(txt(d,'#find-count'))&&/No matching order in the system yet/.test(txt(d,'.no-match'))&&/ask again/.test(txt(d,'.no-match')),'Instagram: no-match guidance with the decline trade-off');
 click(btn(d,/^Decline$/));set($(d,'[name=note]'),'No match in my records');log(/478 characters left/.test(txt(d,'#note-count')),'decline note counter updates');
 log(!$(d,'#note-count').getAttribute('aria-live'),'counter is not a live region');
 submit($(d,'[data-decline]'));await wait(1300);
 log(/Declined ✓/.test(txt(d,'.result'))&&/No match in my records/.test(txt(d,'.result')),'declined with the internal note');
 d=await open('request.html?id=9a3f2c71');log(btn(d,/Add to their account/)&&btn(d,/Add to their account/).disabled,'older order: Add disabled until an order is chosen');
 set($(d,'[data-find] [name=q]'),'8b2');log(d.querySelectorAll('.pick').length===2,'search “8b2” finds two orders');
 const r=[...d.querySelectorAll('[name=pick]')].find(x=>x.value==='8b20d4e6');r.checked=true;r.dispatchEvent(new Event('change',{bubbles:true}));
 log(/Add order 8b20d4e6 to their account/.test(txt(d,'.decision')),'choosing an order enables Add with its ID');
 click(btn(d,/their reference/));log(d.querySelectorAll('.pick').length===1,'“their reference” (the full order ID) finds the one order');
 set($(d,'[data-find] [name=from]'),'2026-01','change');log(/up to 3 months/i.test(txt(d,'#find-out')),'more than 3 months is refused');
 d=await open('request.html?id=5c1e7a02&q=a41c09e7&pick=a41c09e7&answer=order_owned');click(btn(d,/Add order a41c09e7/));submit($(d,'[data-approve]'));await wait(1300);
 log(/already in another customer’s account/.test(txt(d,'.result')),'ORDER_OWNED refusal');
 d=await open('request.html?id=9a3f2c71'+P+'&answer=lost&step=approve');submit($(d,'[data-approve]'));await wait(1300);
 log(/couldn’t tell whether it was saved/.test(txt(d,'.result')),'answer lost');click(btn(d,/Try again/,'.result button'));await wait(1300);
 log(/Added to Tom Becker’s account/.test(txt(d,'.result')),'retry after a lost answer succeeds (same decision)');
 d=await open('request.html?id=9a3f2c71'+P+'&answer=stale_closed&step=done&decision=approve');log(/deleted their account/.test(txt(d,'.result')),'stale message names account deletion');
 click(btn(d,/Show the latest/,'.result a'));await wait(700);d=f.contentDocument;
 log(/Closed · account deleted/.test(txt(d,'.page-head'))&&/don’t appear in any list/.test(txt(d,'main')),'Show the latest: closed, explained');
 d=await open('request.html?id=e41a7b2c');log(/no longer in any account/.test(txt(d,'main'))&&/Nothing: the account was deleted/.test(txt(d,'main')),'added then account deleted: order in no account');
 d=await open('requests.html?state=more');click($(d,'[data-more]'));log(d.querySelectorAll('#rows tr').length===8,'Show the next requests adds the next page');
 d=await open('requests.html?role=support');log(!d.querySelector('a[href="requests.html"] .nav-count')&&/Elina’s \(chef\) only/.test(txt(d,'.role-note')),'technical support: no item, role note');
 d=await open('order.html?id=92e6b3d1');log(/in a customer’s account/.test(txt(d,'#account-card'))&&!d.querySelector('#account-card .steps'),'order in an account: how-to steps hidden');
 d=await open('order.html?id=e5d2b817');log(/GK-016 wording change/.test(txt(d,'#account-card')),'option A states its GK-016 prerequisite');
 d=await open('order.html?id=e5d2b817&opt=b');set($(d,'[name=acct]'),'0f6d1a2b-3c4d-4e5f-8a9b-0c1d2e3f4a5b');submit($(d,'[data-assign]'));
 log(/Add why/.test(txt(d,'#ev-err'))&&!txt(d,'#acct-err').trim()&&$(d,'[name=evidence]').getAttribute('aria-invalid')==='true'&&/ev-err/.test($(d,'[name=evidence]').getAttribute('aria-describedby')),'option B: missing evidence error on the evidence field');
 set($(d,'[name=acct]'),'');submit($(d,'[data-assign]'));log($(d,'[name=acct]').getAttribute('aria-invalid')==='true','option B: empty account ID refused');
 set($(d,'[name=acct]'),'0f6d1a2b-3c4d-4e5f-8a9b-0c1d2e3f4a5b');set($(d,'[name=evidence]'),'Asked by DM');submit($(d,'[data-assign]'));
 log(/Add order e5d2b817 to account 0f6d1a2b…\?/.test(txt(d,'#cb-h')),'option B: confirm');
 d=await open('today.html');log(/5 requests to add orders/.test(txt(d,'.need-claims')),'Today fragment shows the line');
 for(const p of ['requests.html','request.html?id=1d5e88b0','order.html?id=e5d2b817']){d=await open(p);const small=[...d.querySelectorAll('#main button,#main a.btn,#main input,#main select')].filter(e=>e.offsetParent&&e.getBoundingClientRect().height<44&&e.type!=='radio');log(!small.length,`${p}: controls at least 44 px tall${small.length?' ('+small.map(e=>e.textContent.trim()||e.name).join(', ')+')':''}`)}
 f.style.width='390px';
 d=await open('request.html?id=1d5e88b0');const order=['find-h','dec-h','who-h'].map(id=>d.getElementById(id).getBoundingClientRect().top);log(order[0]<order[1]&&order[1]<order[2],'390 px: decision follows Find the order, before the profile');
 d=await open('requests.html');const sb=d.querySelector('.sidebar'),cur=d.querySelector('.sidebar a[aria-current]');const rr=cur.getBoundingClientRect();log(rr.left>=0&&rr.right<=390,'390 px: Account requests scrolled into view in the top bar');
 for(const p of STATES.map(x=>x[1])){d=await open(p);const w=d.documentElement.scrollWidth;const main=d.querySelector('#main')||d.body;const over=[...main.querySelectorAll('*')].filter(e=>e.getBoundingClientRect().right>391&&!e.closest('.sidebar,.table-wrap'));log(w<=390&&!over.length,`390 px, no overflow: ${p}${over.length?' ('+over.slice(0,3).map(e=>e.className||e.tagName).join(', ')+')':''}`)}
 document.title=fails?`FAIL ${fails}`:'PASS';
})();
</script></body></html>
