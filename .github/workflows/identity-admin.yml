# GK-021: operator identity commands on staging (api/cmd/gk-identity-admin).
# Grants or revokes a staff capability, disables or re-enables an account, or
# shows one, with the migration credential; the database audits each change.
# Used to bootstrap the first manager approved in GK-010 and to cut off access
# until chefs manage staff in the application. Only repository admins can run
# it, from main. Inputs (provider user IDs, capability, note) are visible in
# the run; never put personal data in the note.
name: Identity admin
run-name: Identity admin ${{ inputs.action }} ${{ inputs.capability }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Command
        required: true
        type: choice
        options: [show, grant, revoke, disable, enable]
      subject:
        description: Provider user ID (UUID from Supabase Authentication > Users)
        required: true
        type: string
      capability:
        description: Staff capability (grant and revoke only)
        required: true
        type: choice
        options: [none, chef, fulfillment, technical_support]
        default: none
      note:
        description: Why (required for changes; no personal data)
        required: false
        type: string

permissions: {}

concurrency:
  group: identity-admin
  cancel-in-progress: false

jobs:
  admin:
    name: identity-admin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install the Supabase CA the migration credential names
        run: sudo install -D -m 0644 api/certs/supabase-root-2021.crt /etc/gk/supabase-root-2021.crt
      - name: Run the command
        working-directory: api
        env:
          APP_ENV: staging
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          ACTION: ${{ inputs.action }}
          SUBJECT: ${{ inputs.subject }}
          CAPABILITY: ${{ inputs.capability }}
          NOTE: ${{ inputs.note }}
        run: |
          set -o pipefail
          args=(-action "$ACTION" -subject "$SUBJECT")
          if [[ "$CAPABILITY" != "none" ]]; then
            args+=(-capability "$CAPABILITY")
          fi
          if [[ "$ACTION" != "show" ]]; then
            args+=(-note "$NOTE (by $GITHUB_ACTOR, run $GITHUB_RUN_ID)")
          fi
          go run ./cmd/gk-identity-admin "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
