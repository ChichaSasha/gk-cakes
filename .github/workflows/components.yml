# GK-020 component checks for the separately built API and UI.
# Required check names for GK-013: api, api-postgres, ui.
# Validation only: no job deploys, publishes or receives secrets. On pull
# requests, compat (GK-034 AC2) runs the PR's images against what staging runs
# now through .github/scripts/compat-matrix.sh, using a job-local registry.
name: Components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: components-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...
      - name: Build container image (no push)
        run: docker build --platform linux/amd64 -t gk-cakes-api:ci .

  api-postgres:
    name: api-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # the race-enabled integration suite takes ~16 min on hosted runners (checkout alone ~10 min)
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: gk_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GK_TEST_DATABASE_URL: postgres://postgres:gk_disposable@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: PostgreSQL 17 client tools from the pinned service image (backup tests)
        env:
          PG_IMAGE: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        run: |
          mkdir -p "$RUNNER_TEMP/pgbin"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e PGPASSWORD -e PGAPPNAME %s %s "$@"\n' \
              "$PG_IMAGE" "$tool" > "$RUNNER_TEMP/pgbin/$tool"
            chmod +x "$RUNNER_TEMP/pgbin/$tool"
          done
          "$RUNNER_TEMP/pgbin/pg_dump" --version
          {
            echo "GK_TEST_PG_BIN=$RUNNER_TEMP/pgbin"
            echo "GK_REQUIRE_PG_TOOLS=1"
          } >> "$GITHUB_ENV"
      - name: Migrations, real-role gateway and worker shutdown tests
        run: go test -race -tags=integration -p 1 -count=1 ./...
      - name: gk-migrate on an empty database, then no-op
        env:
          APP_ENV: test
          MIGRATION_DATABASE_URL: ${{ env.GK_TEST_DATABASE_URL }}
        run: |
          go run ./cmd/gk-migrate
          go run ./cmd/gk-migrate

  ui:
    name: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Format and lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Backend secrets absent from build output
        run: npm run test:bundle-secrets
      - name: Build
        run: npm run build
      - name: Build container image (no push)
        run: docker build --platform linux/amd64 -t gk-cakes-ui:ci .
      - name: Start the built server and check /healthz
        run: |
          PORT=3000 ORIGIN=http://127.0.0.1:3000 node build &
          server=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'
          kill -TERM "$server"
          wait "$server"
      - name: Check security headers with sign-in configured
        run: |
          PORT=3001 ORIGIN=http://127.0.0.1:3001 \
            PUBLIC_API_URL=https://api.example.com PUBLIC_AUTH_URL=https://auth.example.com \
            PUBLIC_AUTH_PUBLISHABLE_KEY=sb_publishable_0123456789abcdefXYZ node build &
          server=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          scripts/check-headers.sh http://127.0.0.1:3001 https://api.example.com https://auth.example.com
          kill -TERM "$server"
          wait "$server"

  compat:
    name: compat
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the PR's images into the job registry
        run: |
          set -o pipefail
          for c in api ui; do
            ref="localhost:5000/gk-cakes-$c:pr"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -t "$ref" "$c"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            echo "NEW_${c^^}=localhost:5000/gk-cakes-$c@$digest" >> "$GITHUB_ENV"
          done
      - name: Resolve the images staging runs now
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: .github/scripts/resolve-images.sh
      - name: Compatibility matrix against staging (AC2)
        run: .github/scripts/compat-matrix.sh
