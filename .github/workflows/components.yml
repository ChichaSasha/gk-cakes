# GK-020 component checks for the separately built API and UI.
# Required check names for GK-013: api, api-postgres, ui.
# Validation only: no job deploys, publishes or receives secrets.
name: Components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: components-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...

  api-postgres:
    name: api-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: gk_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GK_TEST_DATABASE_URL: postgres://postgres:gk_disposable@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Migrations, real-role gateway and worker shutdown tests
        run: go test -race -tags=integration -p 1 -count=1 ./...
      - name: gk-migrate on an empty database, then no-op
        env:
          APP_ENV: test
          MIGRATION_DATABASE_URL: ${{ env.GK_TEST_DATABASE_URL }}
        run: |
          go run ./cmd/gk-migrate
          go run ./cmd/gk-migrate

  ui:
    name: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Format and lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Backend secrets absent from build output
        run: npm run test:bundle-secrets
      - name: Build
        run: npm run build
      - name: Start the built server and check /healthz
        run: |
          PORT=3000 ORIGIN=http://127.0.0.1:3000 node build &
          server=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'
          kill -TERM "$server"
          wait "$server"
