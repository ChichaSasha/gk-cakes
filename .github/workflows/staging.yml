# GK-034: the only path that deploys staging.
#   workflow_run      a green Components run on a push to main: reuse or build
#                     the API and UI images for that exact commit (a reused tag
#                     must carry that commit in its revision label), push them
#                     to ghcr.io and deploy their digests, but only while the
#                     commit is still the head of main (no accidental downgrade).
#   workflow_dispatch sent by the release workflow for a prerelease that passed
#                     the release gate: re-verify the artifact (commit on main,
#                     green main CI, registry digest and revision label), skip
#                     if that release is already deployed, refuse it if a higher
#                     release of that component is recorded, then deploy it.
# All staging deploys share one concurrency group and are never cancelled
# while running. Before any deploy, the compatibility-matrix job runs the
# deployed and candidate images against a disposable database (AC2, see
# .github/scripts/compat-matrix.sh). API deploys run migrations first and stay
# off until the repository variable STAGING_API_ENABLED is true. Each deploy
# ends with a public smoke check through STAGING_API_URL / STAGING_UI_URL
# (environment variables of the staging environment). The worker (GK-024) runs
# the same API image as its own Railway service (RAILWAY_WORKER_SERVICE_ID,
# start command gk-worker, no public endpoint); it deploys after a successful
# API deploy once STAGING_WORKER_ENABLED is true, and must stay up for a settle
# period (it exits at start if its email or recovery-journal settings are bad).
name: Staging
run-name: ${{ inputs.version && format('Staging release {0}', inputs.version) || format('Staging {0}', github.event.workflow_run.head_sha) }}

on:
  workflow_run:
    workflows: [Components]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options: [api, ui]
      commit_sha:
        description: Verified main commit (40 hex)
        required: true
        type: string
      digest:
        description: Registry digest sha256:<64 hex>
        required: true
        type: string
      version:
        description: Release tag, e.g. api-v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publish:
    name: publish-images
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      version: main-${{ github.event.workflow_run.head_sha }}
      deploy_api: ${{ steps.push.outputs.deploy_api }}
      deploy_ui: ${{ steps.push.outputs.deploy_ui }}
      api_image: ${{ steps.push.outputs.api_image }}
      ui_image: ${{ steps.push.outputs.ui_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reuse or build images for the verified commit
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" != "$SHA" ]]; then
            echo "- skipped: commit \`$SHA\` is no longer the head of main (\`$head\`)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for component in api ui; do
            tag="$registry/gk-cakes-$component:sha-$SHA"
            if out=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' 2>&1); then
              digest=$(jq -r .digest <<<"$out")
              note=reused
            elif grep -qiE 'not found|manifest unknown|name unknown|denied|403 forbidden' <<<"$out"; then
              # Missing tag, or a package that does not exist yet (ghcr answers
              # denied/403 for those); transient errors fall through and fail.
              docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push \
                --label "org.opencontainers.image.revision=$SHA" --tag "$tag" "$component"
              digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
              note=built
            else
              echo "cannot inspect $tag: $out" >&2
              exit 1
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected registry digest for $tag: $digest" >&2
              exit 1
            fi
            # A reused tag must still be the image built from this commit.
            revision=$(docker buildx imagetools inspect "$registry/gk-cakes-$component@$digest" --format '{{json .Image}}' |
              jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')
            if [[ "$revision" != "$SHA" ]]; then
              echo "$tag ($digest) was built from commit '$revision', not $SHA; refusing to deploy" >&2
              exit 1
            fi
            {
              echo "deploy_${component}=true"
              echo "${component}_image=$registry/gk-cakes-$component@$digest"
            } >> "$GITHUB_OUTPUT"
            echo "- $component ($note): \`$registry/gk-cakes-$component@$digest\` (commit \`$SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          done

  verify:
    name: verify-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
      deployments: read
    env:
      IN_COMPONENT: ${{ inputs.component }}
      IN_SHA: ${{ inputs.commit_sha }}
      IN_DIGEST: ${{ inputs.digest }}
      IN_VERSION: ${{ inputs.version }}
      API_ENABLED: ${{ vars.STAGING_API_ENABLED }}
    outputs:
      sha: ${{ inputs.commit_sha }}
      version: ${{ inputs.version }}
      deploy_api: ${{ steps.check.outputs.deploy_api }}
      deploy_ui: ${{ steps.check.outputs.deploy_ui }}
      api_image: ${{ steps.check.outputs.api_image }}
      ui_image: ${{ steps.check.outputs.ui_image }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$IN_SHA" =~ ^[0-9a-f]{40}$ || ! "$IN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ||
                ! "$IN_VERSION" =~ ^(api|ui)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ||
                "${IN_VERSION%%-v*}" != "$IN_COMPONENT" ]]; then
            echo "invalid dispatch inputs" >&2
            exit 1
          fi
          if [[ "$IN_COMPONENT" == api && "$API_ENABLED" != true ]]; then
            echo "API staging deploys are not enabled (STAGING_API_ENABLED); refusing to report success without deploying" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Re-verify the artifact and check for replay
        id: check
        working-directory: api
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Run the built binary: `go run` would turn exit status 4 into 1.
          go build -o "$RUNNER_TEMP/gk-release-gate" ./cmd/gk-release-gate
          set +e
          "$RUNNER_TEMP/gk-release-gate" -verify -component "$IN_COMPONENT" -commit "$IN_SHA" -digest "$IN_DIGEST" \
            -environment "staging-$IN_COMPONENT" -version "$IN_VERSION"
          code=$?
          set -e
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          case "$code" in
            0)
              {
                echo "deploy_${IN_COMPONENT}=true"
                echo "${IN_COMPONENT}_image=$registry/gk-cakes-$IN_COMPONENT@$IN_DIGEST"
              } >> "$GITHUB_OUTPUT"
              echo "- $IN_VERSION verified: \`$registry/gk-cakes-$IN_COMPONENT@$IN_DIGEST\` (commit \`$IN_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            4)
              echo "- $IN_VERSION is already deployed to staging; skipped (replay)" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "$code"
              ;;
          esac

  compat:
    name: compatibility-matrix
    needs: [publish, verify]
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' || needs.verify.result == 'success') &&
      (needs.publish.outputs.deploy_api == 'true' || needs.verify.outputs.deploy_api == 'true' ||
       needs.publish.outputs.deploy_ui == 'true' || needs.verify.outputs.deploy_ui == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    env:
      NEW_API: ${{ needs.publish.outputs.api_image || needs.verify.outputs.api_image }}
      NEW_UI: ${{ needs.publish.outputs.ui_image || needs.verify.outputs.ui_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Resolve deployed and candidate images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: .github/scripts/resolve-images.sh
      - name: Previous/current compatibility matrix (AC2)
        run: .github/scripts/compat-matrix.sh

  deploy-api:
    name: deploy-api
    needs: [publish, verify, compat]
    if: >-
      !cancelled() && vars.STAGING_API_ENABLED == 'true' &&
      (needs.publish.result == 'success' || needs.verify.result == 'success') &&
      needs.compat.result == 'success' &&
      (needs.publish.outputs.deploy_api == 'true' || needs.verify.outputs.deploy_api == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      SHA: ${{ needs.publish.outputs.sha || needs.verify.outputs.sha }}
      VERSION: ${{ needs.publish.outputs.version || needs.verify.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.api_image || needs.verify.outputs.api_image }}
      SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Record deployment
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(.github/scripts/record-deployment.sh create staging-api "$SHA" "${IMAGE#*@}" "$VERSION")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Migrate once with the migration credential (advisory lock)
        env:
          GHCR_TOKEN: ${{ github.token }}
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm -e APP_ENV=staging -e MIGRATION_DATABASE_URL --entrypoint /usr/local/bin/gk-migrate "$IMAGE"
      - name: Deploy API image
        working-directory: api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: go run ./cmd/gk-railway-deploy -service "$SERVICE_ID" -environment "$ENVIRONMENT_ID" -image "$IMAGE" -healthcheck /readyz
      - name: Public smoke check
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
          UI_URL: ${{ vars.STAGING_UI_URL }}
        run: .github/scripts/smoke.sh api "$API_URL" "$UI_URL"
      - name: Record result
        if: always() && steps.record.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOYMENT: ${{ steps.record.outputs.id }}
        run: .github/scripts/record-deployment.sh status "$DEPLOYMENT" "$STATE" "api ${IMAGE#*@}"

  deploy-worker:
    name: deploy-worker
    needs: [publish, verify, deploy-api]
    if: >-
      !cancelled() && vars.STAGING_WORKER_ENABLED == 'true' &&
      needs.deploy-api.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      deployments: write
    env:
      SHA: ${{ needs.publish.outputs.sha || needs.verify.outputs.sha }}
      VERSION: ${{ needs.publish.outputs.version || needs.verify.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.api_image || needs.verify.outputs.api_image }}
      SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Record deployment
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(.github/scripts/record-deployment.sh create staging-worker "$SHA" "${IMAGE#*@}" "$VERSION")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy worker (API image, gk-worker) and watch it settle
        working-directory: api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          go run ./cmd/gk-railway-deploy -service "$SERVICE_ID" -environment "$ENVIRONMENT_ID" -image "$IMAGE" \
            -start-command /usr/local/bin/gk-worker -settle 90s
      - name: Record result
        if: always() && steps.record.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOYMENT: ${{ steps.record.outputs.id }}
        run: .github/scripts/record-deployment.sh status "$DEPLOYMENT" "$STATE" "worker ${IMAGE#*@}"

  deploy-ui:
    name: deploy-ui
    needs: [publish, verify, compat, deploy-api]
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' || needs.verify.result == 'success') &&
      needs.compat.result == 'success' &&
      (needs.publish.outputs.deploy_ui == 'true' || needs.verify.outputs.deploy_ui == 'true') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      deployments: write
    env:
      SHA: ${{ needs.publish.outputs.sha || needs.verify.outputs.sha }}
      VERSION: ${{ needs.publish.outputs.version || needs.verify.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.ui_image || needs.verify.outputs.ui_image }}
      SERVICE_ID: ${{ vars.RAILWAY_UI_SERVICE_ID }}
      ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Record deployment
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(.github/scripts/record-deployment.sh create staging-ui "$SHA" "${IMAGE#*@}" "$VERSION")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy UI image
        working-directory: api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: go run ./cmd/gk-railway-deploy -service "$SERVICE_ID" -environment "$ENVIRONMENT_ID" -image "$IMAGE" -healthcheck /healthz
      - name: Public smoke check
        env:
          UI_URL: ${{ vars.STAGING_UI_URL }}
        run: .github/scripts/smoke.sh ui "$UI_URL"
      - name: Record result
        if: always() && steps.record.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOYMENT: ${{ steps.record.outputs.id }}
        run: .github/scripts/record-deployment.sh status "$DEPLOYMENT" "$STATE" "ui ${IMAGE#*@}"
